<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">  
        <title>Registration</title>
        <link rel="stylesheet" href="./registration.css">
    </head>

    <body>
        
        <h1>Event Registration</h1>

        <div id="registration-form">
            <div id="eventTitle"></div>
            <section class="main-body">
                <div class="inputs">
                    Name
                    <input name="name-box" class="textbox" placeholder="Enter your full name....">
                </div>

                <div class="select-option">
                    <div class="inputs">
                        Age
                        <select id="age" class="selection">
                            <option hidden selected>--Select Your Age--</option>
                            <option>10-20</option>
                            <option>20-30</option>
                            <option>30-40</option>
                            <option>40-50</option>
                             <option>50-60</option>
                            <option>60+</option>
                        </select>
                    </div>
                    <div class="inputs">
                        Gender
                        <select id="gender" class="selection">
                            <option hidden selected>--Select Your Gender--</option>
                            <option>He/Him</option>
                            <option>She/Her</option>
                            <option>They/Them</option>
                        </select>
                    </div>
                </div>

                <div class="inputs">
                    Phone Number
                    <input name="number-box" class="textbox" placeholder="Enter your phone number....">
                </div>

                <div class="inputs">
                    E-Mail
                    <input name="mail-box" class="textbox" placeholder="Enter your mailing address....">
                </div>      
            </section>

            <dialog id="successBox">
                <h2>🎉 Thank You!</h2>        
                <p>You have successfully registered for the event!</p>
                <p id="unique"></p>
                <p>Will keep you posted on further updates on your email and phone number.</p>
                <div class="social-links">
                    <strong>Follow us:</strong>
                    <a href="https://instagram.com" target="_blank">Instagram</a> | 
                    <a href="https://twitter.com" target="_blank">Twitter</a> | 
                    <a href="https://facebook.com" target="_blank">Facebook</a>
                </div>
                <button id="home" class="buttons">Home</button>
            </dialog>

            <div id="errorMsg"></div>
            <div id="btns">
                <button id="clear" class="buttons">Clear</button>
                <button id="save" class="buttons">Save</button>
                <button id="cancel" class="buttons">Cancel</button>
            </div>
        </div>
        
        <script src="registration.js"></script>

        
    </body>
</html>
